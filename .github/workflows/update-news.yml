name: 자동차 뉴스 업데이트

on:
  schedule:
    - cron: "7 */2 * * *"    # 2시간마다 뉴스 갱신
    - cron: "45 22 * * *"    # 매일 오전 7시 45분(한국) 갱신 + 아침 이메일 발송
  workflow_dispatch:         # 수동 실행 버튼
    inputs:
      send_mail:
        description: "이메일도 지금 보내기"
        type: boolean
        default: false
  push:                      # 코드가 바뀌면 바로 한 번 실행
    branches: [main]
    paths: ["fetch_news.py", "make_icons.py", ".github/workflows/update-news.yml"]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 앱 아이콘 생성 (최초 1회)
        run: '[ -f icon-192.png ] || python make_icons.py'
      - name: 뉴스 수집
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python fetch_news.py news.json
      - name: 변경 내용 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json icon-*.png
          git diff --cached --quiet || git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main && git push
      - name: 아침 이메일 발송
        if: github.event.schedule == '45 22 * * *' || inputs.send_mail == true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_email.py news.json
