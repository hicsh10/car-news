plugins {
    id 'com.android.application'
}

def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.hicsh10.carnews'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hicsh10.carnews'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // 업데이트 설치가 끊기지 않도록 고정된 서명 키 사용
        app {
            storeFile file('carnews.keystore')
            storePassword 'carnews'
            keyAlias 'carnews'
            keyPassword 'carnews'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
